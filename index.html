<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BSGC Workspace</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#16202A; --muted:#5B6774; --line:#D3D9DF;
  --accent:#1E4E79; --accent-ink:#FFFFFF; --stamp:#B3261E; --stamp-bg:#FBEDEC; --chip:#E3E9EF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11161B; --surface:#1A2128; --ink:#E6EBEF; --muted:#95A1AC; --line:#2C3640;
    --accent:#7FB0DC; --accent-ink:#0E1A26; --stamp:#F07167; --stamp-bg:#2A1B1C; --chip:#24303A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-size:1.5rem;margin:0;letter-spacing:-.02em;line-height:1.3}
h3{font-size:1.05rem;margin:0;letter-spacing:-.01em}
h4{font-size:1rem;margin:0;font-weight:650}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:.5rem .9rem;font-weight:600}
.ghost,.btn{background:transparent;border:1px solid var(--line);border-radius:6px;padding:.45rem .8rem;text-decoration:none;display:inline-block;color:var(--ink)}
.mini{background:transparent;border:1px solid var(--line);border-radius:4px;padding:.1rem .55rem;font-size:.84rem;color:var(--muted);white-space:nowrap}
.mini.strong{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.danger{background:transparent;border:1px solid var(--stamp);color:var(--stamp);border-radius:6px;padding:.45rem .8rem}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-size:inherit;text-align:left}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{resize:vertical;line-height:1.55}
label{display:block;font-size:.88rem;color:var(--muted);margin:.7rem 0}
label>input,label>select,label>textarea{margin-top:.25rem}
label.check{display:flex;gap:.5rem;align-items:center;color:var(--ink)}
label.check input{margin:0}
label.inline{display:flex;gap:.5rem;align-items:center;margin:0;white-space:nowrap}
label.inline select,label.inline input{width:auto;margin:0}
.hint{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);padding:1rem 0;margin:0}
.cnt{color:var(--muted);font-weight:400;font-size:.85rem}

/* gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.gate-box{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2rem}
.gate h1{font-size:1.65rem;margin:0 0 .2rem;letter-spacing:-.03em}
.gate .sub{color:var(--muted);margin:0 0 1rem}
.gate .primary,.gate .wide{width:100%;margin-top:.4rem;padding:.65rem}
.gate .or{margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--line)}
.msg{color:var(--stamp);min-height:1.3em;font-size:.9rem;margin:.6rem 0 0}
.gate-foot{display:flex;justify-content:space-between;gap:1rem;margin-top:1.2rem;font-size:.85rem;flex-wrap:wrap}
.gate-foot label,.gate-foot button{margin:0;color:var(--accent);cursor:pointer;background:none;border:0;padding:0;font-size:.85rem}

/* shell */
.top{position:sticky;top:0;z-index:5;display:flex;gap:1rem;align-items:center;padding:.7rem 1.25rem;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{border:0;background:none;padding:0;display:flex;align-items:center;gap:.55rem;white-space:nowrap}
.brand img{height:30px;width:auto;display:block}
.brand span,.gate-title span{font-weight:600;color:var(--muted);letter-spacing:.01em}
.brand span{font-size:.95rem;padding-left:.55rem;border-left:1px solid var(--line)}
.logo-dark{display:none!important}
@media (prefers-color-scheme:dark){.logo-light{display:none!important}.logo-dark{display:block!important}}
.gate-title{margin:0 0 .4rem}
.gate-title img{height:58px;width:auto;display:block}
.gate-title span{display:block;font-size:1.05rem;margin-top:.55rem}
.search{flex:1;max-width:560px}
.top-actions{display:flex;gap:.5rem;align-items:center;margin-left:auto}
.save-state{font-size:.82rem;color:var(--muted);max-width:15rem;line-height:1.3;text-align:right}
.save-state.dirty{color:var(--stamp)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 58px)}
.side{border-right:1px solid var(--line);padding:1rem .75rem}
.side-link,#clientList button{display:flex;justify-content:space-between;gap:.5rem;width:100%;text-align:left;background:none;border:0;padding:.4rem .6rem;border-radius:6px}
.side-link.on,#clientList button.on{background:var(--chip);font-weight:600}
.side-head{display:flex;justify-content:space-between;align-items:center;margin:1.2rem .6rem .4rem;font-size:.85rem;color:var(--muted)}
#clientList{list-style:none;margin:0;padding:0}
.folder{margin:.15rem 0}
.folder>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:.4rem;padding:.35rem .6rem;border-radius:6px;font-size:.85rem;font-weight:600;color:var(--ink)}
.folder>summary::-webkit-details-marker{display:none}
.folder>summary::before{content:"▸";color:var(--muted);font-size:.75rem;transition:transform .15s}
.folder[open]>summary::before{transform:rotate(90deg)}
.folder>summary .f-name{flex:1}
.folder ul{list-style:none;margin:0 0 .4rem;padding:0 0 0 .6rem}
.rel{display:inline-flex;gap:.4rem;align-items:center;font-size:.85rem;color:var(--muted);margin-top:.3rem}
.rel .badge-long{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 .45rem;font-size:.75rem;font-weight:700}
.rel .badge-other{border:1px solid var(--line);border-radius:4px;padding:0 .45rem;font-size:.75rem}
@media (prefers-reduced-motion:reduce){.folder>summary::before{transition:none}}
.side-empty{padding:.4rem .6rem;font-size:.88rem}
.view{padding:1.75rem 2rem 4rem;max-width:1200px}

/* home */
.home-intro p{max-width:62ch;color:var(--muted);margin:.4rem 0 0}
.quick{display:flex;gap:.5rem;margin-top:1.1rem;flex-wrap:wrap}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2.5rem;margin-top:2.25rem}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;border-bottom:2px solid var(--ink);padding-bottom:.4rem}
.more{margin-top:.6rem}

/* records */
.rec{display:grid;grid-template-columns:6.2rem minmax(0,1fr) auto;gap:.75rem;padding:.9rem 0;border-bottom:1px solid var(--line)}
.rec-date{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem;padding-top:.08rem;line-height:1.35}
.rec-date small{display:block;font-size:.75rem}
.rec-head{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.rec-meta{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;margin-top:.25rem;font-size:.85rem;color:var(--muted)}
.rec-act{display:flex;flex-direction:column;gap:.3rem;align-items:flex-end}
.tag{background:var(--chip);border-radius:4px;padding:0 .45rem;font-size:.8rem;color:var(--ink)}
.tag.type{background:transparent;border:1px solid var(--line);color:var(--muted)}
.ref{font-variant-numeric:tabular-nums}
.tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.45rem}
.links{margin-top:.35rem;display:flex;gap:.8rem;flex-wrap:wrap}
.links a{font-size:.85rem;color:var(--accent)}
.rec-sum{margin:.4rem 0 0;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.rec-sum.open{display:block}
.stamp{display:inline-block;border:2px solid var(--stamp);color:var(--stamp);border-radius:5px;padding:0 .38rem;font-size:.74rem;font-weight:800;line-height:1.45;transform:rotate(-6deg);letter-spacing:.06em;flex:none}
.stamp.sm{font-size:.66rem;border-width:1.5px;padding:0 .3rem}
.status{font-size:.74rem;font-weight:700;border-radius:4px;padding:0 .4rem;line-height:1.6}
.status.진행중{background:var(--accent);color:var(--accent-ink)}
.status.보류{background:var(--chip);color:var(--muted)}
.special-note{margin-top:.55rem;background:var(--stamp-bg);border-left:3px solid var(--stamp);padding:.5rem .75rem;border-radius:0 6px 6px 0}
.special-note strong{font-size:.8rem;color:var(--stamp)}
.special-note .rec-sum{margin-top:.15rem}
.reflected{font-size:.78rem;color:var(--muted)}
.tag.cause{background:var(--stamp-bg);color:var(--stamp)}
.cause-grid{display:flex;flex-wrap:wrap;gap:.1rem 1.1rem}
.cause-grid label{margin:.2rem 0}
.amend{margin-top:1.75rem}
.amend .chips{margin-top:.75rem}
.amend .chip{cursor:default}
.amend .chip b{color:var(--stamp);margin-left:.3rem;font-variant-numeric:tabular-nums}
.pre-check{margin:.4rem 0 0;padding-left:1.4rem;max-width:72ch}
.pre-check li{margin:.25rem 0}
.pre-check li::marker{color:var(--stamp);font-weight:700}
h4.sub{margin:1.1rem 0 0;font-size:.92rem}
.who{font-size:.82rem;color:var(--muted);white-space:nowrap}
.fee-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:2.5rem;margin-top:1.5rem}
.fee-out table{margin-top:.75rem}
.fee-out .total td{font-weight:800;font-size:1.05rem;border-top:2px solid var(--ink)}
.kv{display:grid;grid-template-columns:9rem minmax(0,1fr);gap:.3rem .9rem;margin:.75rem 0;font-size:.92rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.bl-form{display:flex;gap:.6rem;align-items:flex-end;flex-wrap:wrap;margin-top:1rem}
.bl-form label{margin:0}.bl-form input,.bl-form select{width:auto}
.cc-list td{font-size:.88rem}
.scan-list label{display:flex;gap:.5rem;align-items:flex-start;color:var(--ink);margin:.35rem 0}
.scan-list input{margin-top:.3rem}
@media (max-width:860px){.fee-grid{grid-template-columns:1fr}}
.letter-body{font-family:"Batang","Noto Serif KR",serif;line-height:1.8}
mark{background:#FFE58A;color:#16202A;border-radius:2px;padding:0 1px}

/* d-day */
.dday{font-variant-numeric:tabular-nums;font-weight:700;font-size:.78rem;border-radius:4px;padding:0 .4rem;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dday.soon{color:var(--stamp);border-color:var(--stamp)}
.dday.over{background:var(--stamp);border-color:var(--stamp);color:#fff}
.dl-chip{display:inline-flex;gap:.3rem;align-items:center;font-size:.8rem}
.dl-row{display:grid;grid-template-columns:auto 4.6rem minmax(0,1fr);gap:.6rem;align-items:start;padding:.6rem 0;border-bottom:1px solid var(--line)}
.dl-row input{margin-top:.3rem}
.dl-row .dday{justify-self:start;margin-top:.15rem}

/* checklist */
.progress{height:4px;background:var(--chip);border-radius:2px;margin-top:.55rem;overflow:hidden;max-width:320px}
.progress i{display:block;height:100%;background:var(--accent)}
details.ck summary{cursor:pointer;font-size:.85rem;color:var(--muted);margin-top:.3rem}
.ck ul{list-style:none;padding:0;margin:.3rem 0 .2rem}
.ck li label{display:flex;gap:.45rem;align-items:flex-start;margin:.1rem 0;color:var(--ink);font-size:.9rem}
.ck li label input{margin-top:.3rem}
.ck li.done span{color:var(--muted);text-decoration:line-through}
.ck li small{color:var(--muted);font-size:.75rem;margin-left:.3rem}
.ck .ck-sub{font-size:.8rem;color:var(--muted);margin:.4rem 0 0}

/* client */
.client-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start}
.client-meta{color:var(--muted);margin:.25rem 0 0}
.client-act{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.client-notes{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.75rem 1rem;white-space:pre-wrap;max-width:75ch;margin:1rem 0 0}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1.25rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.2rem .8rem;font-size:.88rem}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.client-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:2.5rem;margin-top:1.75rem}
.items{margin-top:1.75rem}
.narrow{max-width:780px;margin-top:1.5rem}

/* tables */
.table-wrap{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:.9rem}
table.grid th,table.grid td{text-align:left;padding:.5rem .55rem;border-bottom:1px solid var(--line);vertical-align:top}
table.grid th{font-weight:600;color:var(--muted);font-size:.82rem;white-space:nowrap}
table.grid td.pre{white-space:pre-wrap;min-width:14rem}
table.grid .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.grid .hs{font-variant-numeric:tabular-nums;white-space:nowrap}

/* procedures */
.proc{padding:1rem 0;border-bottom:1px solid var(--line)}
.proc header{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.proc header .p-act{margin-left:auto;display:flex;gap:.3rem}
.proc ol{margin:.6rem 0 0;padding-left:1.5rem}
.proc li{margin:.15rem 0}
.proc li::marker{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.proc-docs,.proc-caution{margin-top:.55rem;font-size:.9rem}
.proc-docs p,.proc-caution p{margin:.1rem 0 0;white-space:pre-wrap}
.proc-caution strong{color:var(--stamp)}
.proc.is-common h4{color:var(--muted)}
.note{font-size:.8rem;color:var(--muted)}
.upd{font-size:.78rem;color:var(--muted);margin-top:.45rem}

/* search, report */
.filters{display:flex;gap:1.25rem;align-items:center;flex-wrap:wrap;margin:1rem 0 .5rem}
.filters label.check{margin:0}
.result-block{margin-top:1.75rem}
.result-block .chips{margin-top:.75rem}
.report-lead{max-width:66ch;color:var(--muted);margin:.75rem 0 0}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:.4rem;align-items:end;height:150px;margin-top:1.75rem;max-width:760px}
.bar{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:100%;font-size:.75rem;color:var(--muted);background:none;border:0;padding:0;text-align:center}
.bar i{display:block;background:var(--line);border-radius:3px 3px 0 0;min-height:2px}
.bar.on i{background:var(--accent)}
.bar b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.bar span{margin-top:.2rem}

/* dialog */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(720px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(10,15,20,.45)}
.dlg{display:flex;flex-direction:column;max-height:92vh}
.dlg>h3{padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.dlg-body{padding:.25rem 1.25rem 1rem;overflow:auto}
.dlg footer{display:flex;gap:.5rem;padding:.8rem 1.25rem;border-top:1px solid var(--line)}
.sp{flex:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.dlg-section{border-top:1px solid var(--line);margin-top:1rem;padding-top:.25rem}
.dlg-section h4{margin:.75rem 0 .25rem}
.dlg-section p{margin:.25rem 0 .6rem}
.btn-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.btn-row select{flex:1;min-width:12rem;width:auto}
.btn-row label{margin:0;cursor:pointer;color:var(--ink)}
.dl-list{list-style:none;padding:0;margin:.4rem 0}
.dl-list li{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.3rem 0;border-bottom:1px dashed var(--line)}
.dl-list li .mini{margin-left:auto}
.dl-add{display:flex;gap:.6rem;align-items:flex-end;flex-wrap:wrap}
.dl-add label{margin:.4rem 0 0;flex:1;min-width:9rem}
.dl-add button{flex:none}
.related{margin-top:1rem;border-top:1px dashed var(--line);padding-top:.25rem;font-size:.88rem}
.related h4{font-size:.85rem;margin:.75rem 0 .2rem;color:var(--muted);font-weight:600}
.related ul{list-style:none;padding:0;margin:0}
.related li{padding:.25rem 0}
.related .rec-date{font-size:.82rem;margin-right:.3rem}
.mini-ol{margin:.15rem 0 .3rem;padding-left:1.3rem;color:var(--muted)}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1rem 1.25rem;max-width:70ch;margin-top:1.25rem}
.setup ol{padding-left:1.3rem;margin:.4rem 0}

.toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20}
.toast.show{opacity:1}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .folder ul{display:flex;gap:.25rem;padding:0}
  .folder{display:flex;align-items:center}
  .side{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:.25rem;overflow-x:auto;padding:.5rem;align-items:center}
  .side-head{margin:0 .4rem;white-space:nowrap}
  #clientList{display:flex;gap:.25rem}
  #clientList button,.side-link{white-space:nowrap;width:auto}
  .two-col,.client-grid,.row2{grid-template-columns:1fr}
  .view{padding:1.1rem 1rem 3rem}
  .top{flex-wrap:wrap;padding:.6rem 1rem}
  .search{order:3;flex-basis:100%;max-width:none}
  .save-state{display:none}
  .rec{grid-template-columns:minmax(0,1fr) auto}
  .rec-date{grid-column:1/-1;padding:0}
  .rec-date small{display:inline;margin-left:.3rem}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media print{.top,.side,.mini,.client-act,.quick,.rec-act{display:none!important}.layout{display:block}}
</style>
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-box">
    <h1 class="gate-title"><img class="logo-light" src="logo.png" alt="BSGC Blue Stripe Global Consulting"><img class="logo-dark" src="logo-dark.png" alt="BSGC Blue Stripe Global Consulting"><span>Workspace</span></h1>
    <p class="sub">업체별 처리 절차와 업무 기록을 모아 두는 곳입니다.</p>
    <div id="gateUnlock" hidden>
      <label>아이디<input id="uid" autocomplete="username" placeholder="예전 비밀번호 방식 대장은 비워 두세요"></label>
      <label>비밀번호<input type="password" id="pw" autocomplete="current-password"></label>
      <button id="btnUnlock" class="primary">로그인</button>
      <p id="gateMsg" class="msg" role="status"></p>
    </div>
    <div id="gateNew" hidden>
      <p class="hint">다른 PC에서 쓰던 대장이 있으면 Drive 유틸 폴더의 data.enc.json을 여세요.</p>
      <button type="button" class="ghost wide" id="btnOpenFile">Drive에서 대장 파일 열기</button>
      <p class="hint or">처음 쓰는 경우에만 새 대장을 만드세요. 여기서 정한 비밀번호로 데이터 전체가 암호화됩니다. 비밀번호를 잊으면 복구할 수 없으니 따로 보관하세요.</p>
      <div class="row2"><label>관리자 아이디 (영문·숫자)<input id="nid" autocomplete="username"></label><label>이름<input id="nname"></label></div>
      <label>새 비밀번호 (10자 이상)<input type="password" id="pw1" autocomplete="new-password"></label>
      <label>비밀번호 확인<input type="password" id="pw2" autocomplete="new-password"></label>
      <button id="btnCreate" class="primary">새 대장 만들기</button>
      <p id="gateMsg2" class="msg" role="status"></p>
    </div>
    <div class="gate-foot">
      <label id="gateFileLink">다른 대장 파일 열기<input type="file" id="gateFile" accept=".json,application/json" hidden></label>
      <button id="gateToNew" hidden>새 대장으로 시작</button>
      <button id="gateToUnlock" hidden>기존 대장 열기</button>
    </div>
  </div>
</div>

/* ---------- helpers ---------- */
function esc(s){return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36) + Math.random().toString(36).slice(2,8);}

function nowIso(){return new Date().toISOString();}
function b64(buf){const b = new Uint8Array(buf); let s = ''; for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(s);}
function unb64(s){const bin = atob(s); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u;}
function hl(t){const s = esc(t); return hlRe ? s.replace(hlRe, '<mark>$1</mark>') : s;}

/* 기간 계산: 초일 불산입 기준으로 '기준일 + 기간'의 같은 날짜를 말일로 봄 (월말은 해당 월 말일로 맞춤) */
function addPeriod(iso, n, u){
  const [y,m,d] = iso.split('-').map(Number);
  if(u === 'd') return new Date(Date.UTC(y, m-1, d+n)).toISOString().slice(0,10);
  const tm = (m-1) + (u === 'y' ? n*12 : n);
  const ty = y + Math.floor(tm/12), mm = ((tm % 12) + 12) % 12;
  const last = new Date(Date.UTC(ty, mm+1, 0)).getUTCDate();
  return `${ty}-${String(mm+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`;
}
function daysLeft(due){return Math.round((Date.parse(due) - Date.parse(today())) / 864e5);}
function ddayHTML(due){
  const n = daysLeft(due);
  const cls = n < 0 ? 'over' : n <= 7 ? 'soon' : '';
  return `<span class="dday ${cls}">${n < 0 ? 'D+' + (-n) : n === 0 ? 'D-day' : 'D-' + n}</span>`;
}
function isAmend(r){return /정정|수정신고|보완|기각|경정/.test(hay(r.title, r.tags, r.summary));}
function causesOf(r){
  if(Array.isArray(r.causes)) return r.causes;
  if(!isAmend(r)) return [];
  const h = hay(r.title, r.summary, r.specialNote, r.tags);
  return CAUSES.filter(c => CAUSE_WORDS[c].some(w => h.includes(w)));
}
function clientCauses(cid){
  const m = {}, recs = db.records.filter(r => r.clientId === cid);
  let n = 0;
  recs.forEach(r => { const cs = causesOf(r); if(cs.length) n++; cs.forEach(c => m[c] = (m[c] || 0) + 1); });
  return {list: Object.entries(m).sort((a,b) => b[1] - a[1] || CAUSES.indexOf(a[0]) - CAUSES.indexOf(b[0])), records: n};
}
function josa(w, a){
  const ch = String(w).trim().slice(-1), code = ch.charCodeAt(0) - 0xAC00;
  const has = code >= 0 && code <= 11171 ? code % 28 : -1;
  if(a === '으로') return has === 0 || has === 8 || has === -1 ? '로' : '으로';
  return has > 0 ? a : ({'이':'가','을':'를','은':'는'}[a] || a);
}
function monthsBetween(a, b){const [y1,m1] = a.split('-').map(Number), [y2,m2] = b.split('-').map(Number); return (y2-y1)*12 + (m2-m1);}
/* 거래 기간: 업체 정보의 거래 시작·최근 업무 월과 기록 날짜를 합쳐 계산. 1년 이상 유지 = 기간 12개월 이상 + 최근 12개월 안에 업무 */
function relationOf(c){
  const rel = c.relation || {};
  const ds = db.records.filter(r => r.clientId === c.id).map(recDate).filter(Boolean).map(d => d.slice(0,7)).sort();
  const firsts = [rel.since, ds[0]].filter(Boolean).sort(), lasts = [rel.last, ds[ds.length-1]].filter(Boolean).sort();
  const first = firsts[0] || '', last = lasts[lasts.length-1] || '';
  const months = first && last ? monthsBetween(first, last) : 0;
  const recent = !!last && monthsBetween(last, today().slice(0,7)) <= 12;
  return {first, last, months, recent, longTerm: months >= 12 && recent, basis: rel.basis || ''};
}
function relationText(r){
  if(!r.first) return '거래 기간 정보 없음';
  const span = r.months >= 12 ? `${Math.floor(r.months/12)}년${r.months % 12 ? ' ' + (r.months % 12) + '개월' : ''}` : `${r.months}개월`;
  return `${r.first} ~ ${r.last} (${span})${r.recent ? '' : ', 최근 1년 업무 없음'}`;
}
function openDeadlines(){
  const out = [];
  db.records.forEach(r => (r.deadlines||[]).forEach(d => { if(!d.done) out.push({r, d}); }));
  return out.sort((a,b) => a.d.due.localeCompare(b.d.due));
}

/* ---------- crypto ---------- */
async function deriveKey(pw, s, iter){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:s, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function importDek(raw){return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']);}
/* 계정 방식: 데이터는 무작위 데이터 키로 암호화하고, 계정마다 자기 비밀번호로 그 키를 감싸 둔다 */
async function wrapFor(id, name, role, pw){
  const sl = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const kek = await deriveKey(pw, sl, ITER);
  const w = await crypto.subtle.encrypt({name:'AES-GCM', iv}, kek, dekRaw);
  return {id, name, role, salt:b64(sl), iter:ITER, iv:b64(iv), wrapped:b64(w)};
}
async function encryptDb(){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, dataKey, enc.encode(JSON.stringify(db)));
  return {format:'bsgc-ledger', v:3, accounts, iv:b64(iv), ct:b64(ct)};
}
async function openBlob(blob, id, pw){
  if(Array.isArray(blob.accounts)){
    const a = blob.accounts.find(x => x.id.toLowerCase() === String(id || '').trim().toLowerCase());
    if(!a) throw new Error('no account');
    const kek = await deriveKey(pw, unb64(a.salt), a.iter || ITER);
    const raw = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(a.iv)}, kek, unb64(a.wrapped)));
    const k = await importDek(raw);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(blob.iv)}, k, unb64(blob.ct));
    return {data:JSON.parse(dec.decode(pt)), raw, key:k, accounts:blob.accounts, me:{id:a.id, name:a.name, role:a.role}};
  }
  const sl = unb64(blob.salt), it = blob.iter || ITER;
  const k = await deriveKey(pw, sl, it);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(blob.iv)}, k, unb64(blob.ct));
  return {data:JSON.parse(dec.decode(pt)), legacy:true};
}
function accountName(id){const a = accounts.find(x => x.id === id); return a ? a.name : id;}

}

function migrate(d){
  d.meta = d.meta || {}; d.settings = d.settings || {};
  if(!Array.isArray(d.settings.taskTypes) || !d.settings.taskTypes.length) d.settings.taskTypes = [...DEFAULT_TYPES];
  d.settings.mail = d.settings.mail || {endpoint:'', token:''};
  ['clients','procedures','records','items','mailSeen','contacts'].forEach(k => { if(!Array.isArray(d[k])) d[k] = []; });
  if(!Array.isArray(d.settings.feeProfiles)) d.settings.feeProfiles = [];
  d.records.forEach(r => {
    if(!STATUSES.includes(r.status)) r.status = '완료';
    r.startDate = r.startDate || r.date || '';
    ['checklist','docs','deadlines','tags','links','reflected'].forEach(k => { if(!Array.isArray(r[k])) r[k] = []; });
  });
  d.meta.version = 2;
  d.meta.updatedAt = d.meta.updatedAt || nowIso();
  return d;
}

  const t = nowIso();
  const d = {meta:{version:2, createdAt:t, updatedAt:t}, settings:{taskTypes:[...DEFAULT_TYPES], mail:{endpoint:'', token:''}}, clients:[], procedures:[], records:[], items:[], mailSeen:[]};

}

/* ---------- gate ---------- */
async function boot(){
  if(!(window.crypto && crypto.subtle)){
    $('#gateUnlock').hidden = false;
    $('#gateMsg').textContent = '이 화면에서는 암호화를 쓸 수 없습니다. https 주소(GitHub Pages)나 최신 브라우저로 여세요.';
    return;
  }
  try{const r = await fetch('data.enc.json', {cache:'no-store'}); if(r.ok){const j = await r.json(); if(j && j.ct) remoteBlob = j;}}catch{}
  try{const s = localStorage.getItem(LS_KEY); if(s) localBlob = JSON.parse(s);}catch{}
  showGate(remoteBlob || localBlob ? 'unlock' : 'new');
}
function showGate(mode){
  const u = mode === 'unlock';
  $('#gateUnlock').hidden = !u; $('#gateNew').hidden = u;
  $('#gateToNew').hidden = !u; $('#gateToUnlock').hidden = u || !(remoteBlob || localBlob);
  $('#gateFileLink').hidden = !u;
  try{const lu = localStorage.getItem(LS_KEY + '-uid'); if(lu && !$('#uid').value) $('#uid').value = lu;}catch{}
  (u ? ($('#uid').value ? $('#pw') : $('#uid')) : $('#nid')).focus();
}
async function unlock(){
  const id = $('#uid').value.trim(), pw = $('#pw').value, msg = $('#gateMsg');
  if(!pw){msg.textContent = '비밀번호를 입력하세요.'; return;}
  msg.textContent = '여는 중…';
  let remote = null, local = null;
  if(remoteBlob) try{remote = await openBlob(remoteBlob, id, pw);}catch{}
  if(localBlob) try{local = await openBlob(localBlob, id, pw);}catch{}
  if(!remote && !local){msg.textContent = '아이디 또는 비밀번호가 맞지 않습니다.'; return;}
  let pick = remote || local;
  if(remote && local && (local.data.meta?.updatedAt || '') > (remote.data.meta?.updatedAt || '')) pick = local;
  remoteUpdatedAt = remote ? (remote.data.meta?.updatedAt || null) : null;
  db = migrate(pick.data);
  let migrated = false;
  if(pick.legacy){
    dekRaw = crypto.getRandomValues(new Uint8Array(32)); dataKey = await importDek(dekRaw);
    const aid = id || 'admin';
    accounts = [await wrapFor(aid, '관리자', 'admin', pw)]; me = {id:aid, name:'관리자', role:'admin'};
    db.meta.updatedAt = nowIso(); migrated = true;
  } else { dekRaw = pick.raw; dataKey = pick.key; accounts = pick.accounts; me = pick.me; }
  try{localStorage.setItem(LS_KEY + '-uid', me.id); exportedAt = localStorage.getItem(LS_KEY + '-exported');}catch{}
  await persistLocal();
  enterApp();
  if(migrated) toast(`계정 로그인 방식으로 바뀌었습니다. 다음부터 아이디 ‘${me.id}’와 같은 비밀번호로 로그인하고, 파일을 새로 받아 Drive에 저장하세요.`);
  else if(remoteBlob && !remote) toast('고른 파일은 이 계정으로 열리지 않아, 이 브라우저에 저장된 사본을 열었습니다.');
  else if(remote && pick === local) toast('이 브라우저에 있는 내용이 고른 파일보다 최신이라 그것을 열었습니다. 작업 후 Drive 파일을 새로 저장하세요.');
}
async function createNew(){

  if(!/^[A-Za-z0-9._-]{3,20}$/.test(id)){msg.textContent = '아이디는 영문·숫자 3~20자로 정하세요.'; return;}
  if(a.length < 10){msg.textContent = '비밀번호는 10자 이상으로 정하세요.'; return;}

  msg.textContent = '만드는 중…';

  accounts = [await wrapFor(id, name, 'admin', a)]; me = {id, name, role:'admin'};

}
function removeSamples(){
  const ids = new Set(db.clients.filter(c => /\(예시\)/.test(c.name)).map(c => c.id));
  if(!ids.size) return 0;
  db.clients = db.clients.filter(c => !ids.has(c.id));
  db.records = db.records.filter(r => !ids.has(r.clientId));
  db.procedures = db.procedures.filter(x => !ids.has(x.clientId));
  db.items = db.items.filter(i => !ids.has(i.clientId));
  return ids.size;
}

async function scanContacts(cid){
  const c = db.clients.find(x => x.id === cid), cfg = db.settings.mail || {};
  if(!cfg.endpoint || !cfg.token){toast('먼저 데이터 메뉴에서 Apps Script 웹 앱 주소와 토큰을 넣어 주세요.'); return;}
  const kw = (c.keyword || c.name).trim();
  toast('메일을 살펴보는 중입니다…');
  let j;
  try{
    const u = new URL(cfg.endpoint); u.searchParams.set('token', cfg.token); u.searchParams.set('scan', kw); u.searchParams.set('days', '365');
    j = await (await fetch(u.href)).json();
    if(!j.ok) throw new Error(j.error || '응답 오류');
  }catch(e){toast('스캔하지 못했습니다: ' + e.message + ' (Apps Script를 새 버전으로 배포했는지 확인하세요)'); return;}
  const known = new Set((c.contacts || []).map(p => p.email));
  openDialog({
    title: `${c.name} 담당자 스캔 결과`,
    saveLabel: '선택한 담당자 저장',
    body: `<p class="hint">검색어 ‘${esc(kw)}’로 최근 1년 메일을 살펴봤습니다. 저장할 담당자를 고르세요.</p>
      <div class="scan-list">${(j.contacts || []).length ? j.contacts.map(p => `<label><input type="checkbox" name="pick" value="${esc(p.email)}"${known.has(p.email) || p.count >= 2 ? ' checked' : ''}> <span><strong>${esc(p.name || p.email)}</strong> <span class="hint">${esc(p.email)}, 메일 ${p.count}통, 최근 ${esc(p.last)}</span></span></label>`).join('') : '<p class="empty">찾은 담당자가 없습니다.</p>'}</div>
      ${(j.subjects || []).length ? `<h4 class="sub">최근 업무 메일 ${j.subjects.length}건</h4><ul class="pre-check">${j.subjects.slice(0,10).map(w => `<li><span class="hint">${esc(w.date)}</span> ${esc(w.subject)}</li>`).join('')}</ul><label class="check"><input type="checkbox" name="saveWork" checked> 업체 화면에 최근 업무로 표시</label>` : ''}`,
    onSave(fd){
      const picked = new Set(fd.getAll('pick'));
      const map = new Map((c.contacts || []).map(p => [p.email, p]));
      (j.contacts || []).filter(p => picked.has(p.email)).forEach(p => map.set(p.email, {...(map.get(p.email) || {}), ...p}));
      c.contacts = [...map.values()].sort((a,b) => (b.count || 0) - (a.count || 0));
      if(fd.get('saveWork') === 'on') c.recentWork = (j.subjects || []).slice(0,15);
      c.scannedAt = today();
      toast(`담당자 ${picked.size}명을 반영했습니다.`);
    }
  });
}

  const call = async params => { const u = new URL(cfg.endpoint); u.searchParams.set('token', cfg.token); Object.entries(params).forEach(([k,v]) => u.searchParams.set(k, v)); const j = await (await fetch(u.href)).json(); if(!j.ok) throw new Error(j.error || '응답 오류'); return j; };
  let j;
  try{
    do { j = await call({bizscan:1}); toast(`사업자등록증 읽는 중… ${j.items.length}/${j.total}`); } while(j.remaining > 0);
  }catch(e){toast('읽지 못했습니다: ' + e.message + ' (Apps Script 재배포와 Drive API 서비스 추가를 확인하세요)'); return;}
  const items = j.items.filter(x => x.name || x.biz);
  const match = it => db.clients.find(c => (it.biz && c.bizNo === it.biz) || (it.name && normName(c.name) === normName(it.name)));
  openDialog({
    title: `사업자등록증 ${items.length}건 반영`,
    saveLabel: '선택 항목 반영',
    body: `<p class="hint">폴더의 파일 ${j.total}개 중 ${items.length}건을 읽었습니다${j.failed ? `(읽기 실패 ${j.failed}건)` : ''}. 반영할 업체를 고르세요. 기존 업체는 등록번호나 상호가 같으면 합칩니다.</p>
      <label class="check"><input type="checkbox" name="mail" checked> 메일에서 업무담당자와 관련업무도 찾기 (업체당 몇 초씩 걸립니다)</label>
      <div class="table-wrap"><table class="grid"><thead><tr><th></th><th>회사명</th><th>대표자</th><th>사업장 소재지</th><th>반영</th></tr></thead><tbody>
      ${items.map((it, i) => { const m = match(it); return `<tr><td><input type="checkbox" name="pick" value="${i}" checked></td><td>${esc(it.name || '(상호 미인식)')}<div class="hint">${esc(it.biz || '')} ${safeUrl(it.link) ? `<a href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">원본</a>` : ''}</div></td><td>${esc(it.rep)}</td><td class="pre">${esc(it.addr)}</td><td>${m ? `기존: ${esc(m.name)}` : '새 업체'}</td></tr>`; }).join('')}
      </tbody></table></div>`,
    onSave(fd){
      const picks = fd.getAll('pick').map(Number), withMail = fd.get('mail') === 'on';
      const touched = [];
      picks.forEach(i => {
        const it = items[i]; let c = match(it);
        if(!c){ c = {id:uid(), name: it.name || it.fileName, bizNo:'', industry:'', contact:'', keyword:'', notes:'', createdAt:nowIso()}; db.clients.push(c); }
        if(it.biz) c.bizNo = it.biz;
        if(it.rep) c.rep = it.rep;
        if(it.addr) c.address = it.addr;
        if(it.open) c.openDate = it.open;
        if(!c.industry && (it.type || it.item)) c.industry = [it.type, it.item].filter(Boolean).join(' / ');
        if(safeUrl(it.link)) c.bizDoc = it.link;
        touched.push(c);
      });
      $('#dlg').close(); route = {name:'clientlist', id:null}; commit();
      if(!withMail){ toast(`업체 ${touched.length}곳을 반영했습니다.`); return false; }
      (async () => {
        let k = 0;
        for(const c of touched){
          k++; toast(`메일 확인 중… ${k}/${touched.length} ${c.name}`);
          try{
            const r = await call({scan: c.keyword || normName(c.name) || c.name, days: 365});
            const map = new Map((c.contacts || []).map(p => [p.email, p]));
            (r.contacts || []).filter(p => p.count >= 2).slice(0,5).forEach(p => map.set(p.email, {...(map.get(p.email) || {}), ...p}));
            c.contacts = [...map.values()].sort((a,b) => (b.count || 0) - (a.count || 0));
            if((r.subjects || []).length) c.recentWork = r.subjects.slice(0,15);
            c.scannedAt = today();
          }catch(e){}
        }
        commit(); toast(`업체 ${touched.length}곳과 메일 담당자를 반영했습니다.`);
      })();
      return false;
    }
  });
}

/* ---------- 자동 수집 (수입·수출 폴더 신규 업로드 + 메일 매칭) ---------- */
function collectApi(params){
  const cfg = db.settings.mail || {};
  if(!cfg.endpoint || !cfg.token) return Promise.reject(new Error('Apps Script 주소와 토큰이 없습니다'));
  const u = new URL(cfg.endpoint); u.searchParams.set('token', cfg.token);
  Object.entries(params).forEach(([k,v]) => u.searchParams.set(k, v));
  return fetch(u.href).then(r => r.json()).then(j => { if(!j.ok) throw new Error(j.error || '응답 오류'); return j; });
}
function matchClientText(text){
  const t = normName(text);
  let best = null;
  db.clients.forEach(c => {
    const keys = [normName(c.name), c.keyword ? c.keyword.toLowerCase() : ''].filter(k => k && k.length >= 2);
    if(keys.some(k => t.includes(k)) && (!best || normName(c.name).length > normName(best.name).length)) best = c;
  });
  return best;
}
function caseFromItems(c, group){
  const f = group[0], specials = [...new Set(group.flatMap(x => x.special || []))];
  const mail = group.find(x => x.mail) ? group.find(x => x.mail).mail : null;
  const links = [...new Set([...group.map(x => x.link), mail && mail.link].filter(u => safeUrl(u)))];
  return {
    id:uid(), clientId:c.id, type: f.kind === '수출' ? '수출신고' : '수입통관', status:'완료',
    startDate: f.created, date: group.map(x => x.created).sort().slice(-1)[0],
    bl: f.bl || '', refNo: f.declNo || '', fee:null, itemId:'',
    title: `[${f.kind}] ${f.bl || f.declNo || f.name.replace(/\.[^.]+$/, '')}`,
    summary: (mail ? `메일: ${mail.subject} (${mail.date})\n${mail.snippet || ''}\n` : '') + '자료: ' + group.map(x => x.name).join(', '),
    special: specials.length > 0,
    specialNote: specials.length ? `자동 수집에서 특이 절차로 보이는 자료가 확인됨: ${specials.join(', ')}. 내용을 확인해 무엇이 달랐는지 보완하세요.` : '',
    tags: ['자동수집', ...specials], links, checklist:[], docs:[], deadlines:[], reflected:[],
    createdAt: nowIso(), updatedAt: nowIso(), createdBy: 'auto'
  };
}
function applyCollected(items){
  db.collectSeen = db.collectSeen || []; db.collectPending = db.collectPending || [];
  const seen = new Set(db.collectSeen);
  const fresh = items.filter(x => !seen.has(x.id));
  if(!fresh.length) return null;
  const groups = {};
  let pend = 0;
  fresh.forEach(x => {
    const c = matchClientText(`${x.name} ${x.path} ${x.mail ? x.mail.subject : ''}`);
    if(!c){ db.collectPending.push(x); pend++; return; }
    const k = c.id + '|' + x.kind + '|' + (x.bl || x.declNo || x.name);
    (groups[k] = groups[k] || {c, list:[]}).list.push(x);
  });
  let made = 0, sp = 0, upd = 0;
  Object.values(groups).forEach(({c, list}) => {
    const f = list[0];
    const ex = db.records.find(r => r.clientId === c.id && ((f.bl && r.bl === f.bl) || (f.declNo && r.refNo === f.declNo)));
    if(ex){
      const nr = caseFromItems(c, list);
      ex.links = [...new Set([...(ex.links || []), ...nr.links])];
      if(nr.special && !ex.special){ ex.special = true; ex.specialNote = (ex.specialNote ? ex.specialNote + '\n' : '') + nr.specialNote; }
      ex.updatedAt = nowIso(); upd++;
    } else { const r = caseFromItems(c, list); db.records.push(r); made++; if(r.special) sp++; }
  });
  fresh.forEach(x => db.collectSeen.push(x.id));
  if(db.collectSeen.length > 5000) db.collectSeen = db.collectSeen.slice(-5000);
  return {made, sp, upd, pend};
}
async function runCollect(manual){
  try{
    if(manual){ toast('수입·수출 폴더를 확인하는 중입니다…'); await collectApi({collect:1}); }
    const j = await collectApi({inbox:1});
    const r = applyCollected(j.items || []);
    if(r){ commit(); toast(`자동 수집: 새 케이스 ${r.made}건(특이 ${r.sp}건), 기존 기록 보완 ${r.upd}건, 미분류 ${r.pend}건`); }
    else if(manual) toast('새로 올라온 자료가 없습니다.');
  }catch(e){ if(manual) toast('자동 수집을 확인하지 못했습니다: ' + e.message); }
}
function viewInbox(){
  const pend = db.collectPending || [];
  return `<header class="client-head"><div><h2>자동 수집</h2><p class="client-meta">매일 아침 8시 수입·수출 폴더 신규 자료를 확인해 업체 기록으로 넣습니다. 업체를 알아보지 못한 자료만 여기 남습니다.</p></div>

      ${pend.map((x,i) => `<tr><td>${safeUrl(x.link) ? `<a href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">${esc(x.name)}</a>` : esc(x.name)}${(x.special || []).length ? ` <span class="stamp sm">특이</span>` : ''}</td><td>${esc(x.kind)} / ${esc(x.path)}</td><td>${esc(x.created)}</td><td>${x.mail ? esc(x.mail.subject) : ''}</td>
        <td><div class="btn-row"><select data-pend-client="${i}"><option value="">업체 선택</option>${opts(sortedClients().map(c => [c.id, c.name]), '')}</select><button class="mini strong" data-pend-apply="${i}">반영</button><button class="mini" data-pend-drop="${i}">무시</button></div></td></tr>`).join('')}
    </tbody></table></div>` : '<p class="empty">미분류 자료가 없습니다.</p>'}
    <p class="hint">업체를 자동으로 알아보려면 파일명이나 폴더명에 업체명이 들어가야 합니다. 업체 정보의 검색어(약칭)도 함께 씁니다.</p>`;

function applyPending(i, cid){
  const x = db.collectPending[i], c = db.clients.find(y => y.id === cid);
  if(!x || !c){toast('업체를 고르세요.'); return;}
  const ex = db.records.find(r => r.clientId === c.id && ((x.bl && r.bl === x.bl) || (x.declNo && r.refNo === x.declNo)));
  if(ex){ ex.links = [...new Set([...(ex.links || []), x.link].filter(u => safeUrl(u)))]; }
  else db.records.push(caseFromItems(c, [x]));
  db.collectPending.splice(i, 1); commit(); toast(`${c.name} 기록으로 넣었습니다.`);
}
async function blInline(q){
  const el = $('#blInline'); if(!el) return;
  el.innerHTML = '<p class="hint">UNI-PASS 조회 중…</p>';
  try{ const j = await collectApi({bl:q.toUpperCase(), blType:'M', year:new Date().getFullYear()}); el.innerHTML = blResultHTML(j); }
  catch(e){ el.innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
}

/* ---------- 통관수수료 계산 ---------- */
function floor10(n){return Math.floor(n / 10) * 10;}
function num(v){return Number(String(v ?? '').replace(/[^\d.]/g,'')) || 0;}
function calcFee(amount, p){
  let fee = p.flat ? p.flat : floor10(amount * (p.rate || 0));
  if(!p.flat && p.min && fee < p.min) fee = p.min;
  if(!p.flat && p.max && fee > p.max) fee = p.max;
  return {fee, vat: floor10(fee * 0.1)};
}
function feeProfileText(p){
  if(p.flat) return `정액 ${won(p.flat)}`;
  return `${+(p.rate * 100).toFixed(4)}%` + (p.min ? `, 최소 ${won(p.min)}` : '') + (p.max ? `, 최대 ${won(p.max)}` : '');
}
function currentFeeProfile(){
  if(feeState.pid && feeState.pid !== '__own') return db.settings.feeProfiles.find(p => p.id === feeState.pid);
  return {name:'직접 입력', rate: num(feeState.rate) / 100, min: num(feeState.min), max: num(feeState.max)};
}
function feeOutHTML(){
  const amount = num(feeState.amount), p = currentFeeProfile();
  if(!p) return '';
  const {fee, vat} = calcFee(amount, p);
  const extras = lines(feeState.extras).map(l => { const [n, a, t] = l.split('|').map(x => x.trim()); const amt = num(a); return {n: n || '추가 항목', amt, vat: /^(y|과세|o)$/i.test(t || '') ? floor10(amt * 0.1) : 0}; }).filter(e => e.amt);
  const total = fee + vat + extras.reduce((s, e) => s + e.amt + e.vat, 0);
  const rows = [['통관수수료 (공급가)', fee], ['부가세', vat], ...extras.flatMap(e => e.vat ? [[e.n, e.amt], [e.n + ' 부가세', e.vat]] : [[e.n, e.amt]])];
  return `<table class="grid"><tbody>${rows.map(([n,v]) => `<tr><td>${esc(n)}</td><td class="num">${won(v)}</td></tr>`).join('')}<tr class="total"><td>합계</td><td class="num">${won(total)}</td></tr></tbody></table>
    <p class="hint">${esc(p.name)}: ${esc(feeProfileText(p))}. 신고금액 ${won(amount)} 기준, 수수료와 부가세는 10원 미만 버림.</p>
    <button class="ghost" data-fee-copy>결과 복사</button>`;
}

        <div class="row2" ${feeState.pid === '__own' ? '' : 'hidden'} data-own>

          <label>최소 / 최대 (원)<span style="display:flex;gap:.4rem"><input data-fee="min" inputmode="numeric" value="${esc(feeState.min)}" placeholder="최소"><input data-fee="max" inputmode="numeric" value="${esc(feeState.max)}" placeholder="최대"></span></label>

async function queryBl(params){

function monthLabel(ym){const [y,m] = ym.split('-'); return `${y}년 ${Number(m)}월`;}
function shiftMonth(ym, n){const [y,m] = ym.split('-').map(Number); const t = (m-1) + n; return `${y + Math.floor(t/12)}-${String(((t%12)+12)%12 + 1).padStart(2,'0')}`;}
function doneIn(ym){return db.records.filter(r => r.status === '완료' && (r.date || '').startsWith(ym));}
function viewReport(){
  const mon = rptMonth || today().slice(0,7);
  const done = doneIn(mon).sort(byDateDesc);
  const sp = done.filter(r => r.special).length;
  const fee = done.reduce((s,r) => s + (r.fee || 0), 0);
  const opened = db.records.filter(r => (r.startDate || '').startsWith(mon)).length;
  const dueIn = db.records.flatMap(r => r.deadlines || []).filter(d => d.due.startsWith(mon)).length;
  const byClient = {}, byType = {};
  done.forEach(r => {
    const c = byClient[r.clientId] = byClient[r.clientId] || {n:0, sp:0, fee:0};
    c.n++; if(r.special) c.sp++; c.fee += r.fee || 0;
    byType[r.type] = (byType[r.type] || 0) + 1;
  });
  const months = Array.from({length:12}, (_,i) => shiftMonth(mon, i - 11));
  const counts = months.map(m => doneIn(m).length), max = Math.max(1, ...counts);
  const clientRows = Object.entries(byClient).sort((a,b) => b[1].n - a[1].n);
  const typeRows = Object.entries(byType).sort((a,b) => b[1] - a[1]);
  return `<header class="client-head">
      <div><h2>${monthLabel(mon)} 리포트</h2></div>
      <div class="client-act"><label class="inline">월 선택 <input type="month" id="rptMonth" value="${mon}"></label><button class="ghost" data-csv="${mon}">청구용 CSV 받기</button></div>
    </header>
    <p class="report-lead">이 달 완료 ${done.length}건 가운데 특이 처리가 ${sp}건${done.length ? `(${Math.round(sp / done.length * 100)}%)` : ''}이고, 기록된 대행 수수료 합계는 ${won(fee)}입니다. 같은 달에 새로 접수한 업무는 ${opened}건, 기한이 이 달에 돌아오는 항목은 ${dueIn}건입니다.</p>
    <div class="bars" role="group" aria-label="최근 12개월 완료 건수">
      ${months.map((m,i) => `<button class="bar${m === mon ? ' on' : ''}" data-month="${m}" title="${monthLabel(m)} ${counts[i]}건"><b>${counts[i]}</b><i style="height:${Math.round(counts[i] / max * 100)}%"></i><span>${Number(m.slice(5))}월</span></button>`).join('')}
    </div>
    <div class="two-col">
      <section><div class="sec-head"><h3>업체별</h3></div>
        ${clientRows.length ? `<div class="table-wrap"><table class="grid"><thead><tr><th>업체</th><th class="num">완료</th><th class="num">특이</th><th class="num">수수료</th></tr></thead><tbody>
          ${clientRows.map(([id,v]) => `<tr><td><button class="linkish" data-go="client" data-id="${esc(id)}">${esc(clientName(id))}</button></td><td class="num">${v.n}</td><td class="num">${v.sp}</td><td class="num">${won(v.fee)}</td></tr>`).join('')}
          <tr><td><strong>합계</strong></td><td class="num"><strong>${done.length}</strong></td><td class="num"><strong>${sp}</strong></td><td class="num"><strong>${won(fee)}</strong></td></tr>

        ${typeRows.length ? `<div class="table-wrap"><table class="grid"><thead><tr><th>업무 유형</th><th class="num">건수</th></tr></thead><tbody>${typeRows.map(([t,n]) => `<tr><td>${esc(t)}</td><td class="num">${n}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">이 달에 완료한 기록이 없습니다.</p>'}
      </section>
    </div>
    ${(() => {
      const m = {}, perClient = {};
      db.records.filter(r => recDate(r).startsWith(mon)).forEach(r => causesOf(r).forEach(k => { m[k] = (m[k] || 0) + 1; perClient[r.clientId] = (perClient[r.clientId] || 0) + 1; }));
      const rows = Object.entries(m).sort((a,b) => b[1] - a[1]);
      if(!rows.length) return '';
      const top = Object.entries(perClient).sort((a,b) => b[1] - a[1]).slice(0,5);
      return `<div class="two-col"><section><div class="sec-head"><h3>정정·보완 원인</h3></div><div class="table-wrap"><table class="grid"><thead><tr><th>원인</th><th class="num">건수</th></tr></thead><tbody>${rows.map(([k,n]) => `<tr><td>${esc(k)}</td><td class="num">${n}</td></tr>`).join('')}</tbody></table></div></section>
        <section><div class="sec-head"><h3>정정이 많은 업체</h3></div><div class="table-wrap"><table class="grid"><thead><tr><th>업체</th><th class="num">원인 건수</th></tr></thead><tbody>${top.map(([id,n]) => `<tr><td><button class="linkish" data-go="client" data-id="${esc(id)}">${esc(clientName(id))}</button></td><td class="num">${n}</td></tr>`).join('')}</tbody></table></div></section></div>`;
    })()}
    <section class="result-block narrow"><div class="sec-head"><h3>완료 기록 <span class="cnt">${done.length}건</span></h3></div>
      ${done.length ? done.map(r => recordHTML(r, {showClient:true, compact:true})).join('') : '<p class="empty">이 달에 완료한 기록이 없습니다.</p>'}
    </section>`;
}
function exportCsv(mon){
  const rows = doneIn(mon).sort((a,b) => (a.date||'').localeCompare(b.date||''));
  const cell = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const head = ['완료일','업체','업무 유형','참조번호','제목','특이 처리','대행 수수료'];
  const body = rows.map(r => [r.date, clientName(r.clientId), r.type, r.refNo, r.title, r.special ? 'Y' : '', r.fee || ''].map(cell).join(','));
  download(`BSGC-Workspace-${mon}.csv`, '\uFEFF' + [head.map(cell).join(','), ...body].join('\r\n'), 'text/csv;charset=utf-8');
}

/* ---------- mail ---------- */
function matchClient(m){
  const h = hay(m.from, m.lastFrom, m.subject, m.snippet);
  const byKw = db.clients.find(c => c.keyword && h.includes(c.keyword.toLowerCase()));
  if(byKw) return byKw;
  return db.clients.find(c => h.includes(c.name.replace(/\(.*?\)/g,'').trim().toLowerCase())) || null;
}
function findRefNo(text){const m = String(text||'').match(/\b\d{5}-\d{2}-\d{6,7}[A-Z]?\b/); return m ? m[0] : '';}

    <li>오른쪽 위 ‘데이터’ 메뉴의 Gmail 연동 칸에 붙여 넣고 저장합니다.</li></ol>

async function loadMail(){
  const cfg = db.settings.mail;
  mailLoading = true; mailErr = ''; renderView();
  try{
    const u = new URL(cfg.endpoint); u.searchParams.set('token', cfg.token); u.searchParams.set('days', '90');
    const r = await fetch(u.href);
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || '응답 오류');
    mailCache = j.items || [];
  }catch(e){
    mailErr = `메일을 불러오지 못했습니다 (${e.message}). 웹 앱 주소, 토큰, 배포 권한(모든 사용자)을 확인하세요.`;
  }
  mailLoading = false; renderSidebar(); renderView();
}
function markMailDone(m){
  const cfg = db.settings.mail;
  if(!cfg.endpoint || !m.threadId) return;
  try{const u = new URL(cfg.endpoint); u.searchParams.set('token', cfg.token); u.searchParams.set('done', m.threadId); fetch(u.href).catch(() => {});}catch{}
}
function seeMail(id){db.mailSeen.push(id); if(db.mailSeen.length > 3000) db.mailSeen = db.mailSeen.slice(-3000);}

/* ---------- dialogs ---------- */
function openDialog({title, body, onSave, onDelete, onOpen, saveLabel = '저장'}){
  const dlg = $('#dlg');
  dlg.innerHTML = `<form class="dlg"><h3>${esc(title)}</h3><div class="dlg-body">${body}</div>
    <footer>${onDelete ? '<button type="button" class="danger" data-act="del">삭제</button>' : ''}<span class="sp"></span>
    <button type="button" class="ghost" data-act="cancel">취소</button><button type="submit" class="primary">${esc(saveLabel)}</button></footer></form>`;
  const f = dlg.querySelector('form');
  f.addEventListener('submit', e => {e.preventDefault(); if(onSave(new FormData(f), f) === false) return; dlg.close(); commit();});
  f.querySelector('[data-act="cancel"]').onclick = () => dlg.close();
  if(onDelete) f.querySelector('[data-act="del"]').onclick = () => {if(onDelete() === false) return; dlg.close(); commit();};
  dlg.showModal();
  if(onOpen) onOpen(f);
}

function relatedHTML(clientId, type, selfId, itemId){
  const item = itemId ? db.items.find(i => i.id === itemId) : null;
  const procs = db.procedures.filter(p => p.type === type && (p.clientId === clientId || !p.clientId));
  const same = db.records.filter(r => r.id !== selfId && r.clientId === clientId && r.type === type).sort(byDateDesc).slice(0,4);
  const others = db.records.filter(r => r.id !== selfId && r.clientId !== clientId && r.type === type && r.special).sort(byDateDesc).slice(0,3);
  if(!item && !procs.length && !same.length && !others.length) return '<p class="hint">이 업체의 같은 유형 기록과 절차가 아직 없습니다.</p>';
  const li = (r, extra = '') => `<li>${r.special ? '<span class="stamp sm">특이</span> ' : ''}<span class="rec-date">${esc(recDate(r))}</span>${esc(r.title)}${extra}${r.special && r.specialNote ? `<div class="hint" style="white-space:pre-wrap">${esc(r.specialNote)}</div>` : ''}</li>`;
  return `${item ? `<h4>품목 요건: ${esc(item.name)}</h4><ul><li>${item.hs ? `HS ${esc(item.hs)}` : ''}${item.tariff ? `, ${esc(item.tariff)}` : ''}${item.reqs ? `<div class="hint" style="white-space:pre-wrap">${esc(item.reqs)}</div>` : ''}${item.agency ? `<div class="hint">기관: ${esc(item.agency)}</div>` : ''}</li></ul>` : ''}
    ${procs.length ? `<h4>참고할 절차</h4><ul>${procs.map(p => `<li><strong>${esc(p.title)}</strong> <span class="hint">${p.clientId ? '업체 전용' : '공통'}</span>${(p.steps || []).length ? `<ol class="mini-ol">${p.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}${p.cautions ? `<div class="hint" style="white-space:pre-wrap">주의: ${esc(p.cautions)}</div>` : ''}</li>`).join('')}</ul>` : ''}
    ${same.length ? `<h4>이 업체의 같은 업무</h4><ul>${same.map(r => li(r)).join('')}</ul>` : ''}
    ${others.length ? `<h4>다른 업체의 같은 유형 특이 사례</h4><ul>${others.map(r => li(r, ` <span class="hint">${esc(clientName(r.clientId))}</span>`)).join('')}</ul>` : ''}`;
}

      const stat = () => {if(N('status').value === '완료' && !N('date').value) N('date').value = today();};
      const loadProc = (id, ask) => {
        const p = db.procedures.find(x => x.id === id); if(!p) return;
        if(ask && (N('checklist').value.trim() || N('docs').value.trim()) && !confirm('체크리스트를 이 절차 내용으로 바꿀까요?')) return;
        N('checklist').value = (p.steps || []).join('\n'); N('docs').value = splitDocs(p.docs).join('\n');
      };
      N('clientId').addEventListener('change', () => {fillItems(''); fillProcs(); upd();});
      N('type').addEventListener('change', () => {fillProcs(); upd();});
      itemSel.addEventListener('change', upd);
      N('special').addEventListener('change', tog);
      N('status').addEventListener('change', stat);
      X('loadProc').onclick = () => loadProc(procPick.value, true);
      X('addCheck').onclick = () => {
        const cc = clientCauses(N('clientId').value).list;
        if(!cc.length){toast('이 업체는 기록된 정정 원인이 없습니다.'); return;}
        const cur = lines(N('checklist').value);
        const add = cc.map(([k]) => '[점검] ' + CAUSE_HINTS[k]).filter(t => !cur.includes(t));
        N('checklist').value = [...add, ...cur].join('\n');
        toast(add.length ? `점검 항목 ${add.length}개를 맨 앞에 넣었습니다.` : '이미 들어 있습니다.');
      };
      // deadlines
      const dlList = f.querySelector('.dl-list');
      const rule = () => DL_RULES.find(x => x.kind === X('dlKind').value);
      const renderDls = () => {
        dlList.innerHTML = dls.length
          ? dls.map((d,i) => `<li>${ddayHTML(d.due)}<strong>${esc(d.kind)}</strong><span class="hint">기한 ${esc(d.due)}${d.base ? `, 기준일 ${esc(d.base)}` : ''}${d.done ? ', 처리됨' : ''}</span><button type="button" class="mini" data-x-del="${i}">삭제</button></li>`).join('')
          : '<li class="hint">등록된 기한이 없습니다.</li>';
      };
      const prev = () => {
        const ru = rule(), dt = X('dlDate').value;
        X('dlBaseLbl').textContent = ru.base || '기한일';
        X('dlNameWrap').hidden = !!ru.base;
        X('dlPrev').textContent = ru.base && dt ? `계산된 기한: ${addPeriod(dt, ru.n, ru.u)}` : '';
      };
      X('dlKind').onchange = prev; X('dlDate').oninput = prev;
      X('dlAdd').onclick = () => {
        const ru = rule(), dt = X('dlDate').value;
        if(!dt){toast('날짜를 입력하세요.'); return;}
        dls.push({id:uid(), kind:ru.base ? ru.kind : (X('dlName').value.trim() || '기한'), base:ru.base ? dt : null, due:ru.base ? addPeriod(dt, ru.n, ru.u) : dt, done:false});
        X('dlDate').value = ''; X('dlName').value = ''; prev(); renderDls();
      };
      dlList.onclick = e => {const b = e.target.closest('[data-x-del]'); if(b){dls.splice(Number(b.dataset.xDel), 1); renderDls();}};
      fillItems(rec.itemId); fillProcs(); upd(); tog(); prev(); renderDls();
      if(preset.procId){loadProc(preset.procId, false); procPick.value = preset.procId;}
      if(preset.complete){N('status').value = '완료'; stat(); N('summary').focus();}
      else if(isNew) N('title').focus();
    }
  });
}

function letterBody(t, v){
  const reason = v.reason || '          ', num = v.num || '                ';
  const R = `${reason}${josa(reason,'으로')} 인하여`;
  if(t === 'co_after') return `1. 귀관의 노고에 감사드리며, 일익 번창하심을 기원합니다.\n\n2. 원산지증명서 발급 건(${num})에 대해 ${R} 선적 후 발급 신청하오니 선처 바랍니다.\n\n3. 귀관의 업무협조를 요청하는 바입니다.`;
  if(t === 'co_amend') return `1. 귀관의 노고에 감사드리며, 일익 번창하심을 기원합니다.\n\n2. 원산지증명서 발급 건(${num})에 대해 ${R} ${v.item || '선적일자'} 기재사항 정정신청 하오니 선처 바랍니다.\n\n3. 귀관의 업무협조를 요청하는 바입니다.`;
  const items = v.items.length ? v.items.join(', ') : '          ';
  const rows = lines(v.rows);
  const table = rows.length ? `\n\n정정 항목 | 정정 전 | 정정 후\n${rows.join('\n')}` : '';
  return `1. 귀관의 노고에 감사드리며, 일익 번창하심을 기원합니다.\n\n2. 당사 수출신고 건(${num})의 ${items} 기재 내용을 ${R} 아래와 같이 정정 신청하오니 선처 바랍니다.${table}\n\n3. 첨부 서류: ${v.attach || '정정 사유서, 정정 Invoice·Packing List, 기존 수출신고필증'}\n\n4. 귀관의 업무협조를 요청하는 바입니다.`;
}
function renderLetterBody(text){
  const out = []; let tbl = [];
  const flush = () => { if(tbl.length){ out.push('<table>' + tbl.map((r,i) => '<tr>' + r.map(c => i === 0 ? `<th>${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('') + '</tr>').join('') + '</table>'); tbl = []; } };
  String(text).split('\n').forEach(l => { if(l.includes('|')) tbl.push(l.split('|').map(x => x.trim())); else { flush(); out.push(esc(l) + '\n'); } });
  flush(); return out.join('');
}
function printLetter(v){
  const fr = document.createElement('iframe');
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(fr);
  const w = fr.contentWindow; w.document.open();
  w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(v.title)}</title><style>
    @page{size:A4;margin:25mm 22mm}
    body{font-family:"Batang","바탕","Noto Serif KR","Nanum Myeongjo",serif;color:#000;font-size:12pt;line-height:1.9;margin:0}
    h1{text-align:center;font-size:24pt;letter-spacing:.6em;margin:0 0 2em;font-weight:700}
    .meta p{margin:.15em 0}.meta b{display:inline-block;width:4.2em;font-weight:700}
    .body{margin-top:2em;white-space:pre-wrap}
    table{border-collapse:collapse;width:100%;margin:.3em 0 .6em}th,td{border:1px solid #000;padding:.3em .6em;font-size:11pt;text-align:left}th{background:#f2f2f2}
    .date{text-align:center;margin:3.5em 0 2.5em}
    .sign{text-align:right;font-size:13pt}.sign p{margin:.2em 0}
    @media screen{body{max-width:166mm;margin:18mm auto;padding:0 6mm}}
  </style></head><body>
    <h1>사 유 서</h1>
    <div class="meta"><p><b>수 신</b>: ${esc(v.to)}</p><p><b>제 목</b>: ${esc(v.title)}</p></div>
    <div class="body">${renderLetterBody(v.body)}</div>
    <p class="date">${esc(v.date.replace(/-/g,'.'))}</p>
    <div class="sign"><p>${esc(v.company)}</p><p>대표 ${esc(v.rep)}&nbsp;&nbsp;&nbsp;(인)</p></div>
  </body></html>`);
  w.document.close();
  setTimeout(() => { try{ w.focus(); w.print(); }catch(e){ toast('인쇄하지 못했습니다: ' + e.message); } setTimeout(() => fr.remove(), 60000); }, 400);
  return true;
}

/* ---------- 사업자등록증 읽기 (PDF 글자 추출, 안 되면 글자 인식) ---------- */
function loadScript(src){
  return new Promise((res, rej) => {
    if(document.querySelector(`script[src="${src}"]`)) return res();
    const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('필요한 프로그램을 불러오지 못했습니다'));
    document.head.appendChild(el);
  });
}
function joinPdfItems(items){
  const rows = {};
  items.forEach(it => { const y = Math.round(it.transform[5] / 3); (rows[y] = rows[y] || []).push(it); });
  return Object.keys(rows).sort((a,b) => b - a).map(y => rows[y].sort((a,b) => a.transform[4] - b.transform[4]).map(i => i.str).join(' ')).join('\n');
}
async function ocrImage(src, onMsg){
  onMsg('글자 인식 준비 중… 처음 한 번은 1분 정도 걸릴 수 있습니다.');
  await loadScript(TESSERACT);
  const r = await Tesseract.recognize(src, 'kor+eng', {logger: m => { if(m.status === 'recognizing text') onMsg(`글자 인식 중… ${Math.round(m.progress * 100)}%`); }});
  return r.data.text;
}
async function readBizFile(file, onMsg){
  let text = '';
  if(/pdf/i.test(file.type) || /\.pdf$/i.test(file.name)){
    onMsg('PDF 읽는 중…');
    await loadScript(PDFJS); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    const pdf = await pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
    const page = await pdf.getPage(1);
    text = joinPdfItems((await page.getTextContent()).items);
    if(text.replace(/\s/g,'').length < 30){
      const vp = page.getViewport({scale:2.5}), cv = document.createElement('canvas');
      cv.width = vp.width; cv.height = vp.height;
      await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
      text = await ocrImage(cv, onMsg);
    }
  } else text = await ocrImage(file, onMsg);
  return parseBiz(text);
}
function parseBiz(t){
  const T = String(t).replace(/[ \t]+/g, ' ');
  const g = re => { const m = T.match(re); return m ? m[1].trim().replace(/\s{2,}/g, ' ') : ''; };
  const bm = T.match(/(\d{3})\s*-\s*(\d{2})\s*-\s*(\d{5})/);
  const om = T.match(/개\s*업\s*연\s*월\s*일\s*[:：]?\s*(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  const rp = g(/(?:대\s*표\s*자|성\s*명)\s*[:：]?\s*([가-힣A-Za-z][가-힣A-Za-z ]{0,28}?)(?=\s*(?:생\s*년|개\s*업|법\s*인\s*등\s*록|\n|$))/);
  return {
    biz: bm ? `${bm[1]}-${bm[2]}-${bm[3]}` : '',
    name: g(/(?:법\s*인\s*명\s*\(?\s*단\s*체\s*명\s*\)?|상\s*호)\s*[:：]?\s*([^\n]+?)(?=\s*(?:대\s*표\s*자|성\s*명|\n|$))/),
    rep: /^[가-힣](\s[가-힣]){1,4}$/.test(rp) ? rp.replace(/\s/g,'') : rp,
    open: om ? `${om[1]}-${om[2].padStart(2,'0')}-${om[3].padStart(2,'0')}` : '',
    addr: g(/사\s*업\s*장\s*소\s*재\s*지\s*[:：]?\s*([^\n]+)/),
    type: g(/업\s*태\s*[:：]?\s*([^\n]+?)(?=\s*종\s*목|\n|$)/),
    item: g(/종\s*목\s*[:：]?\s*([^\n]+)/)
  };
}

/* ---------- merge import ---------- */
function mergeImport(obj){
  const t = nowIso(), n = {c:0, p:0, i:0, r:0};
  const key = s => String(s || '').replace(/\s+/g,'').replace(/^\(주\)|^주식회사|\(주\)$|㈜/g,'').toLowerCase();
  const byName = new Map(db.clients.map(c => [key(c.name), c]));
  const cMap = {}, iMap = {};
  (obj.clients || []).forEach(c => {
    const ex = byName.get(key(c.name));
    if(ex){
      cMap[c.id] = ex.id;
      if(c.notes && !(ex.notes || '').includes(c.notes.split('\n')[0])) ex.notes = (ex.notes ? ex.notes + '\n\n' : '') + c.notes;
      ['bizNo','industry','contact','rep','keyword','address','openDate'].forEach(k => { if(!ex[k] && c[k]) ex[k] = c[k]; });
      if(c.relation){
        const r = ex.relation || {}, nr = c.relation;
        ex.relation = {
          since: [r.since, nr.since].filter(Boolean).sort()[0] || '',
          last: [r.last, nr.last].filter(Boolean).sort().slice(-1)[0] || '',
          basis: r.basis && nr.basis && !r.basis.includes(nr.basis) ? r.basis + '; ' + nr.basis : (r.basis || nr.basis || '')
        };
      }
    } else {
      const nc = {...c, id:uid(), createdAt:t}; db.clients.push(nc); byName.set(key(nc.name), nc); cMap[c.id] = nc.id; n.c++;
    }
  });
  const cid = id => id ? (cMap[id] || (db.clients.some(c => c.id === id) ? id : null)) : null;
  (obj.items || []).forEach(i => {
    const c = cid(i.clientId); if(!c) return;
    const ex = db.items.find(x => x.clientId === c && key(x.name) === key(i.name));
    if(ex){iMap[i.id] = ex.id; return;}
    const ni = {...i, id:uid(), clientId:c, createdAt:t}; db.items.push(ni); iMap[i.id] = ni.id; n.i++;
  });
  (obj.procedures || []).forEach(p => {
    const c = cid(p.clientId);
    if(p.clientId && !c) return;
    if(db.procedures.some(x => (x.clientId || null) === c && x.type === p.type && key(x.title) === key(p.title))) return;
    db.procedures.push({...p, id:uid(), clientId:c, createdAt:t, updatedAt:t}); n.p++;
  });
  (obj.records || []).forEach(r => {
    const c = cid(r.clientId); if(!c) return;
    if(db.records.some(x => x.clientId === c && key(x.title) === key(r.title) && (x.date || x.startDate) === (r.date || r.startDate))) return;
    db.records.push({...r, id:uid(), clientId:c, itemId:r.itemId ? (iMap[r.itemId] || '') : '', createdAt:t, updatedAt:t}); n.r++;
  });
  n.k = 0; n.f = 0;
  (obj.contacts || []).forEach(c => {
    if(db.contacts.some(x => x.cat === c.cat && key(x.name) === key(c.name) && (x.dept || '') === (c.dept || '') && (x.person || '') === (c.person || ''))) return;
    db.contacts.push({...c, id:uid()}); n.k++;
  });
  (obj.feeProfiles || []).forEach(p => {
    db.settings.feeProfiles = db.settings.feeProfiles || [];
    if(db.settings.feeProfiles.some(x => key(x.name) === key(p.name))) return;
    db.settings.feeProfiles.push({...p, id:uid()}); n.f++;
  });
  migrate(db);
  [...new Set([...(obj.procedures||[]), ...(obj.records||[])].map(x => x.type))].forEach(ty => { if(ty && !db.settings.taskTypes.includes(ty)) db.settings.taskTypes.push(ty); });
  return n;
}

  if('blCargo' in d){queryBl({cargMtNo: d.blCargo}); return;}
  if('acctNew' in d){openAccount(null); return;}
  if('acctEdit' in d){openAccount(accounts.find(x => x.id === d.acctEdit)); return;}
  if('letter' in d && !('go' in d)){openLetter('client' in d ? d.client : curClient); return;}
  if('go' in d){$('#q').value = ''; go(d.go, d.id);}
  else if('newRec' in d) openRecord(null, {clientId: 'client' in d ? d.client : curClient, type: curType, status: d.status || '완료'});
  else if('editRec' in d) openRecord(findRec(d.editRec));
  else if('complete' in d) openRecord(findRec(d.complete), {complete:true});
  else if('reflect' in d) openReflect(findRec(d.reflect));
  else if('newProc' in d) openProc(null, {clientId: 'client' in d ? d.client : curClient, type: curType});
  else if('editProc' in d) openProc(db.procedures.find(p => p.id === d.editProc));
  else if('startProc' in d){const p = db.procedures.find(x => x.id === d.startProc); openRecord(null, {clientId: p.clientId || curClient, type: p.type, status:'진행중', procId: p.id});}
  else if('newClient' in d) openClient(null);
  else if('editClient' in d) openClient(db.clients.find(c => c.id === d.editClient));
  else if('newItem' in d) openItem(null, d.client || curClient);
  else if('editItem' in d) openItem(db.items.find(i => i.id === d.editItem));
  else if('chip' in d){typeFilter = d.chip; renderView();}
  else if('month' in d){rptMonth = d.month; renderView();}
  else if('csv' in d) exportCsv(d.csv);
  else if('mailLoad' in d) loadMail();
  else if('mailMake' in d){const m = (mailCache || []).find(x => x.id === d.mailMake); if(m) openRecord(null, {mail:m, status:'완료'});}
  else if('mailIgnore' in d){const m = (mailCache || []).find(x => x.id === d.mailIgnore); seeMail(d.mailIgnore); if(m) markMailDone(m); commit(); toast('목록에서 뺐습니다.');}
  else if('openData' in d) openDataMenu();
  else if('letter' in d) openLetter('client' in d ? d.client : curClient);
});
$('#view').addEventListener('input', e => {
  const el = e.target;
  if(el.id === 'contactQ'){ $('#contactTable').innerHTML = contactTable(); return; }
  if(el.dataset && el.dataset.fee && el.dataset.fee !== 'pid'){
    if(el.dataset.fee === 'amount'){ const n = num(el.value); el.value = n ? n.toLocaleString('ko-KR') : ''; }
    feeState[el.dataset.fee] = el.value;
    $('#feeOut').innerHTML = feeOutHTML();
  }
});
document.addEventListener('change', e => {
  if(e.target.dataset && e.target.dataset.fee === 'pid' && db){ feeState.pid = e.target.value; $('[data-own]').hidden = e.target.value !== '__own'; $('#feeOut').innerHTML = feeOutHTML(); return; }
  const el = e.target;
  if(!db || el.closest('dialog')) return;
  if(el.matches('[data-ck]')){
    const [rid, kind, i] = el.dataset.ck.split('|');
    const r = db.records.find(x => x.id === rid); if(!r) return;
    const x = (kind === 'c' ? r.checklist : r.docs)[Number(i)]; if(!x) return;
    x.done = el.checked; x.doneAt = el.checked ? today() : null; r.updatedAt = nowIso();
    openCk.add(rid); commit();
  } else if(el.matches('[data-dl]')){
    const [rid, did] = el.dataset.dl.split('|');
    const r = db.records.find(x => x.id === rid); const dl = r && r.deadlines.find(x => x.id === did); if(!dl) return;
    dl.done = true; dl.doneAt = today(); commit(); toast(`‘${dl.kind}’을(를) 처리 완료로 표시했습니다.`);
  } else if(el.id === 'sType'){sOpt.type = el.value; renderView();}
  else if(el.id === 'sSpecial'){sOpt.special = el.checked; renderView();}
  else if(el.id === 'rptMonth' && el.value){rptMonth = el.value; renderView();}
});
document.addEventListener('toggle', e => {
  const el = e.target;
  if(el.matches && el.matches('details[data-ck-rec]')){const id = el.dataset.ckRec; el.open ? openCk.add(id) : openCk.delete(id);}
  if(el.matches && el.matches('details[data-folder]')) folderOpen[el.dataset.folder] = el.open;
}, true);
let searchTimer;
$('#q').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const v = $('#q').value.trim();
    if(v) route = {name:'search', id:null};
    else if(route.name === 'search') route = {name:'home', id:null};
    renderSidebar(); renderView();
  }, 150);
});
document.addEventListener('keydown', e => {
  if(e.key === '/' && db && !$('#dlg').open && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){e.preventDefault(); $('#q').focus();}
});
$('#btnExport').onclick = exportEnc;
$('#btnData').onclick = openDataMenu;
$('#btnLock').onclick = () => location.reload();
$('#btnUnlock').onclick = unlock;
$('#pw').addEventListener('keydown', e => {if(e.key === 'Enter') unlock();});
$('#btnCreate').onclick = createNew;
$('#pw2').addEventListener('keydown', e => {if(e.key === 'Enter') createNew();});
$('#gateToNew').onclick = () => showGate('new');
$('#gateToUnlock').onclick = () => showGate('unlock');
$('#btnOpenFile').onclick = () => $('#gateFile').click();
$('#gateFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if(!file) return;
  try{
    const obj = JSON.parse(await file.text());
    if(!obj.ct){showGate('unlock'); $('#gateMsg').textContent = '암호화 파일(data.enc.json)이 아닙니다.'; return;}
    remoteBlob = obj; showGate('unlock');
    $('#gateMsg').textContent = `${file.name}을(를) 불러왔습니다. 비밀번호를 입력하세요.`;
  }catch{showGate('unlock'); $('#gateMsg').textContent = '파일을 읽지 못했습니다.';}
});

boot();
</script>
