<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BSGC Workspace</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/app.css?v=20261107c">
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-box">
    <h1 class="gate-title"><img class="logo-light" src="logo.png" alt="BSGC Blue Stripe Global Consulting"><img class="logo-dark" src="logo-dark.png" alt="BSGC Blue Stripe Global Consulting"><span>Workspace</span></h1>
    <p class="sub">업체별 처리 절차와 업무 기록을 모아 두는 곳입니다.</p>
    <div id="gateUnlock" hidden>
      <label>아이디<input id="uid" autocomplete="username" placeholder="예전 비밀번호 방식 대장은 비워 두세요"></label>
      <label>비밀번호<input type="password" id="pw" autocomplete="current-password"></label>
      <button id="btnUnlock" class="primary">로그인</button>
      <p id="gateMsg" class="msg" role="status"></p>
    </div>
    <div id="gateNew" hidden>
      <p class="hint">다른 PC에서 쓰던 대장이 있으면 Drive 유틸 폴더의 data.enc.json을 여세요.</p>
      <button type="button" class="ghost wide" id="btnOpenFile">Drive에서 대장 파일 열기</button>
      <p class="hint or">처음 쓰는 경우에만 새 대장을 만드세요. 여기서 정한 비밀번호로 데이터 전체가 암호화됩니다. 비밀번호를 잊으면 복구할 수 없으니 따로 보관하세요.</p>
      <div class="row2"><label>관리자 아이디 (영문·숫자)<input id="nid" autocomplete="username"></label><label>이름<input id="nname"></label></div>
      <label>새 비밀번호 (10자 이상)<input type="password" id="pw1" autocomplete="new-password"></label>
      <label>비밀번호 확인<input type="password" id="pw2" autocomplete="new-password"></label>
      <button id="btnCreate" class="primary">새 대장 만들기</button>
      <p id="gateMsg2" class="msg" role="status"></p>
    </div>
    <div id="gateSync" class="gate-sync" hidden>
      <p class="hint">관리자에게 받은 Apps Script 웹 앱 주소와 토큰을 넣으면 Drive에 저장된 Workspace를 바로 엽니다. 한 번 연결하면 이 PC에서는 다시 넣지 않아도 됩니다.</p>
      <label>웹 앱 주소<input id="gsEp" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
      <label>토큰<input id="gsTk" type="password" autocomplete="off"></label>
      <button type="button" id="btnGateSync" class="primary">연결하고 받기</button>
      <p id="gsMsg" class="msg" role="status"></p>
    </div>
    <div class="gate-foot">
      <button id="gateToSync" type="button">서버 주소로 연결</button>
      <label id="gateFileLink">다른 대장 파일 열기<input type="file" id="gateFile" accept=".json,application/json" hidden></label>
      <button id="gateToNew" hidden>새 대장으로 시작</button>
      <button id="gateToUnlock" hidden>기존 대장 열기</button>
    </div>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <button class="brand" data-go="home" aria-label="BSGC Workspace 홈"><img class="logo-light" src="logo.png" alt="BSGC Blue Stripe Global Consulting"><img class="logo-dark" src="logo-dark.png" alt="BSGC Blue Stripe Global Consulting"><span>Workspace</span></button>
    <div class="search"><input id="q" type="search" placeholder="업체, B/L 번호, 신고번호, 품목, HS 코드, 특이사항 검색 ( / 키)" aria-label="검색"></div>
    <div class="top-actions">
      <span id="who" class="who"></span>
      <span id="saveState" class="save-state" role="status"></span>
      <button id="btnExport" class="primary">암호화 파일 받기</button>
      <button id="btnData" class="ghost">데이터</button>
      <button id="btnLock" class="ghost">잠그기</button>
    </div>
  </header>
  <div class="layout">
    <nav class="side" aria-label="이동">
      <button class="side-link" data-go="home">홈</button>
      <button class="side-link" data-go="active"><span>진행 중 업무</span><span class="cnt" id="cntActive"></span></button>
      <button class="side-link" data-go="mail"><span>customs@ 메일</span><span class="cnt" id="cntMail"></span></button>
      <button class="side-link" data-go="report">월간 리포트</button>
      <button class="side-link" data-go="common">공통 절차</button>
      <button class="side-link" data-letter>사유서 작성</button>
      <button class="side-link" data-go="inbox"><span>자동 수집</span><span class="cnt" id="cntInbox"></span></button>
      <button class="side-link" data-go="clientlist">거래업체 리스트</button>
      <button class="side-link" data-go="contacts">연락처</button>
      <button class="side-link" data-go="fee">수수료 계산</button>
      <button class="side-link" data-go="accounts">계정 관리</button>
      <div class="side-head"><span>업체</span><button class="mini" data-new-client>추가</button></div>
      <div id="clientList"></div>
    </nav>
    <main id="view" class="view"></main>
  </div>
</div>

<dialog id="dlg"></dialog>
<div id="toast" class="toast" aria-live="polite"></div>

<!-- 화면 코드는 js/ 폴더에 기능별로 나뉘어 있습니다. 순서대로 불러와야 합니다. 고친 뒤에는 v= 값을 바꿔 브라우저 캐시를 새로 받게 하세요. -->
<script src="js/core.js?v=20261107c"></script>
<script src="js/sync.js?v=20261107c"></script>
<script src="js/views.js?v=20261107c"></script>
<script src="js/cases.js?v=20261107c"></script>
<script src="js/collect.js?v=20261107c"></script>
<script src="js/tools.js?v=20261107c"></script>
<script src="js/accounts-mail.js?v=20261107c"></script>
<script src="js/dialogs.js?v=20261107c"></script>
<script src="js/import.js?v=20261107c"></script>
<script src="js/events.js?v=20261107c"></script>
</body>
</html>
